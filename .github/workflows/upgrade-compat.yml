name: Upgrade compatibility

# Runs the latest community node on the folder of an official 4.2.532.0 node, and the official node
# again afterwards, on mainnet:
#   1. the official node syncs from block 0 for 30 minutes and stops;
#   2. the community node starts on the same folder: does it quick-start from the official
#      checkpoints or rebuild its state (slow start), and does it keep syncing? Balances of wallets
#      untouched since its last block are compared with the public monitor;
#   3. the official node starts again on the folder the community node left.
#   2b/2c. between 2 and 3 the folder is converted to LMDB (community node runs on it), RocksDB and back
#      to BerkeleyDB, timed against the network sync; phase 3 then proves the official node opens it.
# The community node is built from this commit for Ubuntu 20.04 (build-compat.yml), and both nodes
# run in an Ubuntu 20.04 container, the system the official build targets.
on:
  push:
    tags: ['upgrade-test-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the community node of this commit, for Ubuntu 20.04 and later
  build:
    uses: ./.github/workflows/build-compat.yml
    with:
      artifact: upgrade-node-${{ github.sha }}

  upgrade:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Drop git credentials
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Tools
        run: |
          git submodule update --init -- third-party/thrift-interface-definitions
          sudo apt-get install -y -qq python3-nacl python3-base58
          python3 -m pip install --user --quiet --break-system-packages thriftpy2

      - name: Community node of this commit
        uses: actions/download-artifact@v4
        with:
          name: upgrade-node-${{ github.sha }}
          path: community-build

      - name: Official release
        run: |
          curl -sSfL -o official.tar.gz \
            https://github.com/CREDITSCOM/node/releases/download/mainnet-4.2.532.0/Ubuntu20_Mainnet-4.2.532.0.tar.gz
          mkdir official && tar -xzf official.tar.gz -C official && rm official.tar.gz
          rm -rf official/csnode/javafx-sdk-13
          node=official/csnode
          install -m 755 community-build/node "$node/node-community"
          cp "$node/node" "$node/node-official"
          # the official seed list of 2023 is dead: use the community one; one executor per node
          cp packaging/mainnet/known_hosts.txt "$node/known_hosts.txt"
          sed -i 's/^executor_multi_instance=.*/executor_multi_instance=true/' "$node/config.ini"
          python3 ci/testnet/gen_keys.py 1 keys >/dev/null && cp keys/n1/Node*.txt "$node/"
          grep -n '^\[storage\]' "$node/config.ini" || echo "official config.ini: no [storage] section (full BerkeleyDB)"
          echo "community node of $GITHUB_SHA; official node $(md5sum < "$node/node-official" | cut -c1-12)"

      - name: Run the three phases
        run: |
          node=$PWD/official/csnode
          seq_now() { cat "$node"/log/log_*.txt 2>/dev/null | grep -a 'Last written sequence = ' | tail -1 \
                        | sed -E "s/.*Last written sequence = ([0-9']+).*/\1/" | tr -d "'"; }
          # both run on Ubuntu 20.04, the system the official build targets
          phase() {  # phase <binary> <minutes>
            image=ubuntu:20.04
            docker run -d --name credits --network host --user "$(id -u)" -v "$node:/node" -w /node "$image" \
              "./$1" --db-path db --config-file config.ini >/dev/null
            sleep $(( $2 * 60 ))
          }
          # rate <blocks> <secs> -> blocks per second; chain <blocks> <secs> -> time for 186 M blocks at that pace
          rate() { awk -v b="$1" -v s="$2" 'BEGIN{printf "%.1f", b/s}'; }
          chain() { awk -v b="$1" -v s="$2" 'BEGIN{t=186000000*s/b; if (t<3600) printf "%.0f min", t/60; else printf "%.1f h", t/3600}'; }
          stop() {
            docker stop -t 120 credits >/dev/null; docker logs credits > "$node/docker-$1.log" 2>&1; docker rm credits >/dev/null
            pkill -f '[c]ontract-executor[.]jar' || true
          }

          echo "== phase 1: official node, 30 minutes"
          phase node-official 30
          s1=$(seq_now); echo "official node reached block ${s1:-none}"
          [ "${s1:-0}" -gt 1000 ] || { docker logs --tail 40 credits; exit 1; }
          [[ "$s1" =~ ^[0-9]+$ && "$s1" -gt 0 ]] || { echo "FAIL: phase 1 block count is not a positive number: '$s1'"; exit 1; }
          echo "TIMING network sync: $s1 blocks in 1800 s ($(rate "$s1" 1800) blocks/s)"
          stop official-1
          ls "$node/qs"
          lines1=$(cat "$node"/log/log_*.txt | wc -l)

          echo "== phase 2: community node on the same folder, 20 minutes"
          phase node-community 20
          # the node starts its log file over on each start: read this phase's console output
          after=$(docker logs credits 2>&1)
          grep -aE 'QUICK START!|SLOW START|Caches for QUICK START loaded|schema_version|not on this chain|quarantin|trxIndex needs rebuild|Couldn.t open|caches already hold' <<<"$after" | head -20
          s2=$(seq_now); echo "community node reached block ${s2:-none}"
          docker logs credits > "$node/docker-community.log" 2>&1 || true
          [ "${s2:-0}" -gt "$s1" ] || { echo "FAIL: the community node did not go past block $s1"; docker logs --tail 40 credits; exit 1; }
          python3 ci/snapshot/check_node.py balances --api 127.0.0.1:9090 --count 10 --tries 40 --min-compared 3 \
            || { echo "FAIL: balances differ from the monitor"; exit 1; }
          # the official transaction index is taken over; the official checkpoint is not used (it has no
          # head record, so a checkpoint saved with the live off-by-one cannot be told apart), so the
          # community node rebuilds its state from the local database: a slow start, by design
          grep -aq 'taken over from the legacy last_indexed file' <<<"$after" \
            || { echo "FAIL: the official transaction index was not taken over"; exit 1; }
          python3 ci/snapshot/check_node.py history --api 127.0.0.1:9090 --count 10 --tries 40 --min-compared 3 \
            || { echo "FAIL: transaction histories differ from the monitor"; exit 1; }
          stop community
          lines2=$(cat "$node"/log/log_*.txt | wc -l)

          # conversion of the official folder: BerkeleyDB -> LMDB -> RocksDB -> BerkeleyDB
          cp "$node/config.ini" "$node/config.ini.orig"   # the official config has no [storage] section
          convert() {  # convert <backend>; prints and appends a TIMING line
            sed -i "/^\[storage\]/,/^\[/{/^db_backend=/d}" "$node/config.ini"
            grep -q '^\[storage\]' "$node/config.ini" || printf '\n[storage]\n' >> "$node/config.ini"
            sed -i "/^\[storage\]/a db_backend=$1" "$node/config.ini"
            before=$(du -sb "$node/db" | cut -f1); t0=$(date +%s)
            docker run --rm --network host --user "$(id -u)" -v "$node:/node" -w /node ubuntu:20.04 \
              ./node-community --db-path db --config-file config.ini --convert-only > "$node/convert-$1.log" 2>&1 \
              || { echo "FAIL: conversion to $1"; tail -20 "$node/convert-$1.log"; exit 1; }
            secs=$(( $(date +%s) - t0 )); size_after=$(du -sb "$node/db" | cut -f1)
            line=$(grep -a 'conversion done' "$node/convert-$1.log" | tail -1 || true)
            blocks=$(sed -nE 's/.*conversion done: ([0-9]+) blocks.*/\1/p' <<<"$line")
            [[ "$blocks" =~ ^[0-9]+$ ]] || { echo "FAIL: no 'conversion done' line for $1"; tail -20 "$node/convert-$1.log"; exit 1; }
            [ "$blocks" -gt 0 ] || { echo "FAIL: conversion to $1 reports 0 blocks"; exit 1; }
            note=""; [ "$secs" -ge 1 ] || { secs=1; note=" (min. 1 s)"; }
            echo "TIMING convert to $1: $blocks blocks in $secs s ($(rate "$blocks" "$secs") blocks/s), $((before >> 20)) MB -> $((size_after >> 20)) MB, whole chain $(chain "$blocks" "$secs")"
            echo "| to $1 | $blocks | $secs s$note | $(rate "$blocks" "$secs") | $((before >> 20)) MB -> $((size_after >> 20)) MB | $(chain "$blocks" "$secs") |" >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Block database conversion vs network sync"
            echo "| step | blocks | time | blocks/s | size | whole chain, 186 M blocks (est.) |"
            echo "|---|---|---|---|---|---|"
            echo "| network sync (phase 1) | $s1 | 30 min | $(rate "$s1" 1800) | | $(chain "$s1" 1800) |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "== phase 2b: convert the official folder to lmdb, run the community node 5 minutes"
          convert lmdb
          phase node-community 5
          after=$(docker logs credits 2>&1)
          grep -aq 'QUICK START!' <<<"$after" || { echo "FAIL: no quick start after the conversion"; docker logs --tail 40 credits; exit 1; }
          python3 ci/snapshot/check_node.py balances --api 127.0.0.1:9090 --count 10 --tries 40 --min-compared 3 \
            || { echo "FAIL: balances differ from the monitor after the conversion"; exit 1; }
          python3 ci/snapshot/check_node.py history --api 127.0.0.1:9090 --count 10 --tries 40 --min-compared 3 \
            || { echo "FAIL: histories differ from the monitor after the conversion"; exit 1; }
          s2b=$(seq_now); echo "community node (lmdb) reached block ${s2b:-none}"
          [[ "$s2b" =~ ^[0-9]+$ ]] || { echo "FAIL: no block reached by the community node after the conversion"; exit 1; }
          stop community-lmdb

          echo "== phase 2c: lmdb -> rocksdb -> berkeleydb, back to the official format"
          convert rocksdb
          convert berkeleydb
          echo "_Indicative only: both estimates extrapolate linearly from the first few million blocks, and later blocks are larger._" >> "$GITHUB_STEP_SUMMARY"
          cp "$node/config.ini.orig" "$node/config.ini"   # the official node gets its own config back

          echo "== phase 3: official node again, 10 minutes"
          phase node-official 10
          after=$(docker logs credits 2>&1)
          grep -aE 'QUICK START!|SLOW START|Caches for QUICK START loaded|schema|quarantin|rebuild|Couldn.t open' <<<"$after" | head -20
          s3=$(seq_now); echo "official node reached block ${s3:-none}"
          [ "${s3:-0}" -gt "$s2b" ] || { echo "FAIL: the official node did not go past block $s2b"; docker logs --tail 40 credits; exit 1; }
          stop official-2
          echo "PASS: official $s1 -> community $s2 -> official $s3"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-logs
          path: |
            official/csnode/log/
            official/csnode/docker-*.log
          retention-days: 14
