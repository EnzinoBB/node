name: Robustness

# Fork hunting: the private 7-node network of testnet.yml under conditions that could make honest
# nodes disagree, each scenario on its own runner. Every node reports a state digest every block,
# and a scenario passes only if all nodes report the same digests and reach the target sequence:
# - mixed block databases (BerkeleyDB, LMDB, RocksDB in the same network);
# - a node killed with SIGKILL six times, half of them right after it saved a checkpoint;
# - the whole network killed at once and restarted, as after a power cut;
# - a full disk on a RocksDB, LMDB or BerkeleyDB node; pruned storage on RocksDB with a node joining from block 0;
# - a pruned node killed while it prunes;
# - every block database, full and pruned, in one network, also with crashes and a power cut;
# - packet loss, corruption, delay, reordering and a partition on some nodes, slow nodes, random
#   datagrams, and all of them at once.
# All scenarios run funded transfers and the usual restart test.
on:
  # a robustness-* tag runs it on the tagged commit (a manual run needs the workflow on the default branch)
  push:
    tags: ['robustness-*']
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated scenario names to run (empty = all)'
        default: ''

permissions:
  contents: read

env:
  BOOST_VERSION: 1.83.0
  BOOST_SHA256: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e
  BOOST_PREFIX: /home/runner/boost
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git submodule update --init -- cscrypto p2p \
            third-party/berkeleydb third-party/thrift third-party/thrift-interface-definitions \
            third-party/googletest third-party/lmdb third-party/lmdbxx third-party/nameof third-party/rocksdb
          git -C cscrypto submodule update --init
          git -C p2p submodule update --init

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build flex bison autoconf automake libtool pkg-config ccache

      - name: Restore Boost
        id: cache-boost
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.BOOST_VERSION }}-static-rt-ubuntu-24.04-v1

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          v=${BOOST_VERSION//./_}
          curl -sSfL -o boost.tar.bz2 "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${v}.tar.bz2"
          echo "${BOOST_SHA256}  boost.tar.bz2" | sha256sum -c
          tar xjf boost.tar.bz2
          cd "boost_${v}"
          ./bootstrap.sh --with-libraries=system,filesystem,program_options,date_time,regex,log,iostreams,thread,serialization,atomic,chrono
          ./b2 -j"$(nproc)" -d0 variant=release link=static runtime-link=static threading=multi \
            cxxflags=-fPIC --layout=tagged -sNO_BZIP2=1 -sNO_ZSTD=1 -sNO_LZMA=1 \
            install --prefix="${BOOST_PREFIX}"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-24.04-${{ github.sha }}
          restore-keys: ccache-ubuntu-24.04-

      # the test-network build of testnet.yml
      - name: Build node
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=OFF \
            -DBoost_ROOT="${BOOST_PREFIX}" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-include cstdint -include cstddef" \
            -DWITH_HASKELL=OFF \
            -DCREDITS_TESTNET=ON
          ccache --max-size=2G
          cmake --build build -j"$(nproc)" --target node

      - name: Upload node
        uses: actions/upload-artifact@v4
        with:
          name: testnet-node-${{ github.sha }}
          path: build/client/node
          retention-days: 7

  scenario:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # a few runners at a time: the suite is long and heavy use got Actions disabled once
      max-parallel: 5
      matrix:
        include:
          - name: rocksdb-crash
            env: DB_BACKEND=rocksdb CRASH_NODE=6 TARGET_SEQ=1600
          - name: mixed-crash-berkeleydb
            env: DB_BACKEND=mixed CRASH_NODE=4 TARGET_SEQ=1600
          - name: mixed-crash-lmdb
            env: DB_BACKEND=mixed CRASH_NODE=5 TARGET_SEQ=1600
          - name: mixed-crash-rocksdb
            env: DB_BACKEND=mixed CRASH_NODE=6 TARGET_SEQ=1600
          - name: mixed-power-cut
            env: DB_BACKEND=mixed CRASH_ALL_AT=600
          - name: rocksdb-power-cut
            env: DB_BACKEND=rocksdb CRASH_ALL_AT=600
          - name: rocksdb-disk-full
            env: DB_BACKEND=rocksdb DISK_FULL_NODE=6
          - name: lmdb-disk-full
            env: DB_BACKEND=lmdb DISK_FULL_NODE=6
          - name: berkeleydb-disk-full
            env: DB_BACKEND=berkeleydb DISK_FULL_NODE=6
          - name: lmdb-disk-full-late
            env: DB_BACKEND=lmdb DISK_FULL_NODE=6 DISK_FULL_AT=700
          # pruning starts at the periodic checkpoint #2000 (checkpoint_every + prune_keep_blocks <= 2000)
          - name: rocksdb-pruned-join
            env: DB_BACKEND=rocksdb PRUNE_NODE=6 JOIN_PRUNED_AT=500 TARGET_SEQ=2300
          # kills that land while the node prunes, or right after a checkpoint it prunes from
          - name: rocksdb-pruned-crash
            env: DB_BACKEND=rocksdb PRUNE_NODE=6 CRASH_NODE=6 CRASH_FROM=2000 CRASH_TIMES=3 TARGET_SEQ=2800
          - name: lmdb-pruned-crash
            env: DB_BACKEND=lmdb PRUNE_NODE=6 CRASH_NODE=6 CRASH_FROM=2000 CRASH_TIMES=3 TARGET_SEQ=2800
          # docker stop with a short timeout: SIGTERM, then SIGKILL while the node shuts down
          - name: lmdb-pruned-term-kill
            env: DB_BACKEND=lmdb PRUNE_NODE=6 TERM_KILL_NODE=6 TERM_KILL_FROM=2000 TARGET_SEQ=3000
          - name: berkeleydb-term-kill
            env: DB_BACKEND=berkeleydb TERM_KILL_NODE=3
          # a node that lost its transaction index rebuilds it from its blocks after a quick start
          - name: lmdb-pruned-index-loss
            env: DB_BACKEND=lmdb PRUNE_NODE=6 INDEX_LOSS_AT=2300 TARGET_SEQ=3000
          # a full node without its transaction index: quick start, then the index from its blocks
          - name: berkeleydb-index-loss
            env: DB_BACKEND=berkeleydb INDEX_LOSS_NODE=3 INDEX_LOSS_AT=600
          # network faults on two nodes (tc netem on everything they send and on what is sent to them)
          - name: net-loss
            env: NET_FAULT=loss NET_FAULT_PCT=15 NET_FAULT_NODES=3,5
          - name: net-corrupt
            env: NET_FAULT=corrupt NET_FAULT_PCT=5 NET_FAULT_NODES=3,5
          - name: net-delay
            env: NET_FAULT=delay NET_FAULT_NODES=3,5
          - name: net-reorder-duplicate
            env: NET_FAULT=reorder NET_FAULT_PCT=25 NET_FAULT_NODES=2,6
          - name: net-partition
            env: NET_FAULT=partition NET_FAULT_NODES=5,6 NET_FAULT_AT=300 NET_FAULT_SECONDS=120
          # slow nodes: 5% of one CPU for two trusted nodes
          - name: slow-nodes
            env: SLOW_NODES=3,6 SLOW_CPU=5
          # random datagrams to every node's p2p port
          - name: garbage-datagrams
            env: GARBAGE_AT=150 GARBAGE_RATE=300
          # all at once, on a mixed-backend network
          - name: chaos-mixed
            env: DB_BACKEND=mixed NET_FAULT=corrupt NET_FAULT_PCT=3 NET_FAULT_NODES=4,5 SLOW_NODES=6 GARBAGE_AT=200
          # every block database, full and pruned, in one network (n4-n6 pruned; n8 joins from a
          # snapshot of n5); then the same network with crashes of the pruned BerkeleyDB node, and
          # with a power cut and packet corruption
          - name: all-storage
            env: NODE_STORAGE=berkeleydb,lmdb,rocksdb,berkeleydb:pruned,lmdb:pruned,rocksdb:pruned,berkeleydb,lmdb:pruned PRUNE_NODE=5 SNAPSHOT_AT=2300 TARGET_SEQ=3300
          - name: all-storage-crash
            env: NODE_STORAGE=berkeleydb,lmdb,rocksdb,berkeleydb:pruned,lmdb:pruned,rocksdb:pruned,berkeleydb CRASH_NODE=4 CRASH_FROM=2000 CRASH_TIMES=3 TARGET_SEQ=3300
          - name: all-storage-power-cut
            env: NODE_STORAGE=berkeleydb,lmdb,rocksdb,berkeleydb:pruned,lmdb:pruned,rocksdb:pruned,berkeleydb CRASH_ALL_AT=2500 NET_FAULT=corrupt NET_FAULT_PCT=3 NET_FAULT_NODES=2,6 TARGET_SEQ=3300
          # a node joining from a snapshot taken after the first pruning, and from a truncated one
          - name: snapshot-join
            env: DB_BACKEND=lmdb PRUNE_NODE=6 SNAPSHOT_AT=2300 TARGET_SEQ=3100
          - name: snapshot-corrupt
            env: DB_BACKEND=lmdb PRUNE_NODE=6 SNAPSHOT_AT=2300 SNAPSHOT_CORRUPT=1 TARGET_SEQ=3100
          # node 5 from full to pruned, node 6 from pruned to full, after node 6 pruned once
          - name: storage-switch
            env: DB_BACKEND=lmdb PRUNE_NODE=6 STORAGE_SWITCH_AT=2300 TARGET_SEQ=3300
          - name: db-convert
            env: DB_BACKEND=berkeleydb CONVERT_AT=1500 TARGET_SEQ=2500
    name: ${{ matrix.name }}
    # a manual run can pick scenarios; the others stop at once
    env:
      SELECTED: ${{ inputs.only == '' || contains(format(',{0},', inputs.only), format(',{0},', matrix.name)) }}
    steps:
      - name: Skip unselected scenario
        if: env.SELECTED != 'true'
        run: echo "not selected"
      - name: Checkout
        if: env.SELECTED == 'true'
        uses: actions/checkout@v4

      # fund.py reads the node API definitions from it
      - name: Checkout API definitions
        if: env.SELECTED == 'true'
        run: git submodule update --init -- third-party/thrift-interface-definitions

      - name: Install tools
        if: env.SELECTED == 'true'
        run: |
          git submodule update --init -- third-party/lmdb
          make -s -C third-party/lmdb/libraries/liblmdb mdb_copy
          sudo apt-get install -y -qq zstd
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-nacl python3-base58 gdb
          python3 -m pip install --user --quiet --break-system-packages thriftpy2
          sudo sysctl -w kernel.core_pattern="${{ github.workspace }}/testnet-run/core.%e.%p"

      - name: Download node
        if: env.SELECTED == 'true'
        uses: actions/download-artifact@v4
        with:
          name: testnet-node-${{ github.sha }}
          path: build

      - name: Run private network
        if: env.SELECTED == 'true'
        timeout-minutes: 100
        env:
          SCENARIO: ${{ matrix.env }}
          NODES: '7'
          TARGET_SEQ: '1100'  # a scenario can raise it
          TIMEOUT_MIN: '75'
          RESTART_AT: '300'
          FUND: '1'
          LOAD_SECONDS: '300'
          WORK: ${{ github.workspace }}/testnet-run
        run: |
          chmod +x build/node
          # the scenario's variables come from the matrix above, NAME=value pairs only
          for kv in $SCENARIO; do
            echo "$kv" | grep -qE '^[A-Z_]+=[a-z0-9,:]+$' || { echo "bad scenario entry $kv"; exit 1; }
            export "$kv"
          done
          echo "scenario: $SCENARIO"
          ci/testnet/run.sh build/node

      - name: Upload logs
        if: always() && env.SELECTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.name }}
          path: |
            testnet-run/n*/*.log
            testnet-run/fund.log
            testnet-run/n*/config.ini
          retention-days: 14
