name: Testnet

# A private network of 7 nodes on one runner, about 30 minutes: the nodes are funded from the genesis
# key and exchange transfers, a restarted node catches up, and every node reports the same STATE
# DIGEST. Too long for every push, so it runs
# nightly, on demand, and on pull requests labelled "testnet".
on:
  workflow_dispatch:
    inputs:
      target_seq:
        description: 'Sequence every node must reach (StartingDPOS is 10000)'
        default: '1100'
      timeout_min:
        description: 'Minutes allowed to reach it'
        default: '45'
      disk_full_node:
        description: 'Node whose block DB disk fills up for a while (0 = off)'
        default: '0'
      restart_at:
        description: 'Sequence at which the last node is restarted (0 = off)'
        default: '300'
      dpos_at:
        description: 'Move StartingDPOS to this sequence via special order 9 (0 = off)'
        default: '0'
      reward_round:
        description: 'Turn block rewards on at this round via special order 37 (0 = off)'
        default: '0'
      min_stake:
        description: 'Set the minimum stake via special order 22, in CS (0 = off)'
        default: '0'
      delegate:
        description: 'Nodes delegate to each other, with and without a time limit (0 = off)'
        default: '0'
      contracts:
        description: 'Run a contract executor per node and call a contract through another one (0 = off)'
        default: '0'
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    branches: [master]
    types: [labeled, synchronize, opened, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BOOST_VERSION: 1.83.0
  BOOST_SHA256: 6478edfe2f3305127cffe8caf73ea0176c53769f4bf1585be237eb30798c3b8e
  BOOST_PREFIX: /home/runner/boost
  CCACHE_DIR: /home/runner/.ccache

jobs:
  testnet:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'testnet')
    name: Private network (7 nodes)
    runs-on: ubuntu-24.04
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git submodule update --init -- cscrypto p2p \
            third-party/berkeleydb third-party/thrift third-party/thrift-interface-definitions \
            third-party/googletest third-party/lmdb third-party/lmdbxx third-party/nameof
          git -C cscrypto submodule update --init
          git -C p2p submodule update --init

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build flex bison autoconf automake libtool pkg-config ccache python3-nacl python3-base58
          python3 -m pip install --user --quiet --break-system-packages thriftpy2

      - name: Restore Boost
        id: cache-boost
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.BOOST_PREFIX }}
          key: boost-${{ env.BOOST_VERSION }}-static-rt-ubuntu-24.04-v1

      - name: Build Boost
        if: steps.cache-boost.outputs.cache-hit != 'true'
        run: |
          v=${BOOST_VERSION//./_}
          curl -sSfL -o boost.tar.bz2 "https://archives.boost.io/release/${BOOST_VERSION}/source/boost_${v}.tar.bz2"
          echo "${BOOST_SHA256}  boost.tar.bz2" | sha256sum -c
          tar xjf boost.tar.bz2
          cd "boost_${v}"
          ./bootstrap.sh --with-libraries=system,filesystem,program_options,date_time,regex,log,iostreams,thread,serialization,atomic,chrono
          ./b2 -j"$(nproc)" -d0 variant=release link=static runtime-link=static threading=multi \
            cxxflags=-fPIC --layout=tagged -sNO_BZIP2=1 -sNO_ZSTD=1 -sNO_LZMA=1 \
            install --prefix="${BOOST_PREFIX}"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-ubuntu-24.04-${{ github.sha }}
          restore-keys: ccache-ubuntu-24.04-

      # same configuration as build.yml plus CREDITS_TESTNET (applied only to csnode and net),
      # so most ccache entries are shared
      - name: Build node
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTS=ON \
            -DBoost_ROOT="${BOOST_PREFIX}" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-include cstdint -include cstddef" \
            -DWITH_HASKELL=OFF \
            -DCREDITS_TESTNET=ON
          ccache --max-size=2G
          cmake --build build -j"$(nproc)" --target node

      # CREDITSCOM/contract-executor at its default branch; the node accepts executors built from commit
      # 1506 on, and the build reads the commit count from git, so the clone needs the full history.
      # Its sc-api-internal 2.2 and general 1.3 were never published to the CREDITSCOM maven branches,
      # so they are built from their repositories first.
      - name: Fetch contract executor
        if: inputs.contracts == '1'
        run: |
          git clone --quiet https://github.com/CREDITSCOM/contract-executor.git executor
          git clone --quiet --depth 1 --branch dev https://github.com/CREDITSCOM/sc-api.git executor-deps/sc-api
          # pinned before the libthrift 0.14 bump (a254f6ae), whose module name breaks executor_client's module-info
          git clone --quiet https://github.com/CREDITSCOM/thrift-api-client.git executor-deps/thrift-api-client
          git -C executor-deps/thrift-api-client checkout --quiet 59d1e9af

      - name: Set up Java 11
        if: inputs.contracts == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven
          cache-dependency-path: |
            executor/**/pom.xml
            executor-deps/**/pom.xml

      - name: Build contract executor
        if: inputs.contracts == '1'
        run: |
          (cd executor-deps/thrift-api-client && mvn -B -q -DskipTests install)
          (cd executor-deps/sc-api && mvn -B -q -DskipTests install)
          (cd executor && mvn -B -q -DskipTests package)
          jar=$(find "$PWD/executor/contract-executor/target" -maxdepth 1 -name 'contract-executor-*.jar' | head -1)
          test -n "$jar"
          echo "EXECUTOR_JAR=$jar" >> "$GITHUB_ENV"
          echo "executor jar: $jar (commit count $(git -C executor rev-list --count HEAD))"

      - name: Run private network
        timeout-minutes: 300
        env:
          NODES: '7'
          TARGET_SEQ: ${{ inputs.target_seq || '1100' }}
          TIMEOUT_MIN: ${{ inputs.timeout_min || '45' }}
          DISK_FULL_NODE: ${{ inputs.disk_full_node || '0' }}
          RESTART_AT: ${{ inputs.restart_at || '300' }}
          DPOS_AT: ${{ inputs.dpos_at || '0' }}
          REWARD_ROUND: ${{ inputs.reward_round || '0' }}
          DELEGATE: ${{ inputs.delegate || '0' }}
          MIN_STAKE: ${{ inputs.min_stake || '0' }}
          CONTRACTS: ${{ inputs.contracts || '0' }}
          FUND: '1'
          LOAD_SECONDS: '300'
          WORK: ${{ github.workspace }}/testnet-run
        run: ci/testnet/run.sh build/client/node

      - name: Resource usage
        if: always()
        run: |
          free -m
          df -h "${GITHUB_WORKSPACE}"
          du -sh testnet-run 2>/dev/null || true

      - name: Upload node logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-logs-${{ github.run_id }}
          path: |
            testnet-run/n*/*.log
            testnet-run/fund.log
            testnet-run/contracts.log
            testnet-run/n*/config.ini
          retention-days: 14
