name: Platform consensus check

# The packages for Linux, Windows and macOS (Apple Silicon) each restore the published pruned
# snapshot with --download-snapshot and sync mainnet up to its head, with the executor running as the
# packages ship it. Every node logs its state digest each 1000 blocks: the three systems must log the
# same digests for the same blocks, reach the head at a speed in line with Linux, and stop cleanly
# (Linux and macOS exit with status 0, macOS leaves no crash report).
#
# Where the packages come from:
#   - release.yml calls this workflow on the packages of its own run (release_run = its run id), and
#     publishes the Windows and macOS packages only if it passes;
#   - a scheduled run (weekly) and a manual run without inputs take the latest published community
#     release, so that what users download is what is checked;
#   - a manual run with release_run takes the packages of that Release run (a pull request's too).
on:
  schedule:
    - cron: '0 5 * * 0'   # Sunday 05:00 UTC
  # a platform-sync-* tag checks the latest published release (a manual run needs the workflow on
  # the default branch)
  push:
    tags: ['platform-sync-*']
  workflow_dispatch:
    inputs:
      release_run:
        description: 'Id of a Release workflow run whose artifacts hold the Linux, Windows and macOS packages (empty = the latest published community release)'
        default: ''
      tag:
        description: 'A published release to check, e.g. community-v4.2.532-community.14 (empty = the latest)'
        default: ''
      timeout_min:
        description: 'Minutes each node has to reach the head (Linux needs about 5)'
        default: '30'
      min_common:
        description: 'Blocks with a digest from all three systems needed to pass'
        default: '5'
  workflow_call:
    inputs:
      release_run:
        description: 'Id of the Release run whose artifacts hold the packages: the calling run itself'
        type: string
        default: ''
      current_run:
        description: 'release_run is the calling run, still running: it is not checked for success'
        type: boolean
        default: false
      timeout_min:
        type: string
        default: '30'
      min_common:
        type: string
        default: '5'

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      mode: ${{ steps.src.outputs.mode }}
      run: ${{ steps.src.outputs.run }}
      tag: ${{ steps.src.outputs.tag }}
    steps:
      - name: Where the packages come from
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
          IN_RUN: ${{ inputs.release_run }}
          IN_TAG: ${{ inputs.tag }}
          CURRENT_RUN: ${{ inputs.current_run }}
        run: |
          if [ -n "$IN_RUN" ]; then
            echo "$IN_RUN" | grep -qE '^[0-9]+$' || { echo "bad run id '$IN_RUN'"; exit 1; }
            if [ "$CURRENT_RUN" != true ]; then
              # only runs of code from this repository: a pull request from a fork builds packages too,
              # and those binaries are not run here
              info=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$IN_RUN")
              [ "$(jq -r .path <<< "$info")" = .github/workflows/release.yml ] || { echo "run $IN_RUN is not a Release run"; exit 1; }
              [ "$(jq -r .head_repository.full_name <<< "$info")" = "$GITHUB_REPOSITORY" ] || { echo "run $IN_RUN built code from another repository"; exit 1; }
              [ "$(jq -r .conclusion <<< "$info")" = success ] || { echo "run $IN_RUN did not succeed"; exit 1; }
            fi
            echo "the packages of Release run $IN_RUN"
            printf 'mode=run\nrun=%s\ntag=\n' "$IN_RUN" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="$IN_TAG"
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft,isPrerelease \
              --jq '[.[] | select((.isDraft or .isPrerelease) | not) | .tagName | select(startswith("community-v"))][0]')
          fi
          echo "$tag" | grep -qE '^community-v[0-9A-Za-z._-]+$' || { echo "no published community release found ('$tag')"; exit 1; }
          echo "the packages of the published release $tag"
          printf 'mode=tag\nrun=\ntag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

  sync:
    name: Sync (${{ matrix.os }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-24.04
            package: '*-linux-x64.tar.gz'
            node: ./node
          - os: windows
            runner: windows-2022
            package: '*-windows-x64.zip'
            node: ./node.exe
          - os: macos
            runner: macos-14
            package: '*-macos-arm64.tar.gz'
            node: ./node
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: git submodule update --init -- third-party/thrift-interface-definitions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python packages
        run: python -m pip install --quiet thriftpy2 base58 pynacl

      - name: Download the packages of the run
        if: needs.resolve.outputs.mode == 'run'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.resolve.outputs.run }}
          github-token: ${{ github.token }}
          pattern: credits-node-*
          merge-multiple: true
          path: packages

      # what users download: the package of this system and the checksum files, checked here
      - name: Download the packages of the release
        if: needs.resolve.outputs.mode == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir packages
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir packages --pattern "$PACKAGE" --pattern 'SHA256SUMS*'
          python -I - packages <<'PY'
          import glob, hashlib, os, sys
          root = sys.argv[1]
          sums = {}
          for f in glob.glob(os.path.join(root, "SHA256SUMS*")):
              for line in open(f):
                  parts = line.split()
                  if len(parts) == 2:
                      sums[parts[1].lstrip("*")] = parts[0]
          checked = 0
          for f in glob.glob(os.path.join(root, "credits-node-*")):
              name = os.path.basename(f)
              h = hashlib.sha256(open(f, "rb").read()).hexdigest()
              if sums.get(name) != h:
                  sys.exit(f"{name}: checksum {h} is not the published one {sums.get(name)}")
              checked += 1
              print(f"{name}: checksum ok")
          sys.exit(0 if checked else "no package downloaded")
          PY

      - name: Unpack
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          ls -la packages
          pkg=$(ls packages/$PACKAGE | grep -v glibc | head -1)
          test -n "$pkg"
          echo "package $pkg"
          case "$pkg" in
            *.zip) unzip -q "$pkg" ;;
            *) tar -xzf "$pkg" ;;
          esac
          cp csnode/config.pruned.ini csnode/config.ini
          # the executor of an earlier run on the same machine is not looked for
          sed -i.bak 's/^executor_multi_instance=.*/executor_multi_instance=true/' csnode/config.ini
          [ "${{ matrix.os }}" != macos ] || xattr -dr com.apple.quarantine csnode 2>/dev/null || true
          python ci/testnet/gen_keys.py 1 keys >/dev/null
          cp keys/n1/NodePublic.txt keys/n1/NodePrivate.txt csnode/

      - name: Restore the published snapshot
        working-directory: csnode
        # the import prints hundreds of thousands of debug lines to the console (the job log would be
        # cut before the next steps): only the node's own report lines are kept in the log
        run: |
          ${{ matrix.node }} --config-file config.ini --download-snapshot </dev/null > download.log 2>&1 || { tail -n 60 download.log | cut -c1-300; exit 1; }
          grep -aE '^(download-snapshot|import-snapshot|snapshot)' download.log | cut -c1-250
          tail -n 3 download.log | cut -c1-250

      - name: Sync to the head
        env:
          TIMEOUT_MIN: ${{ inputs.timeout_min || '30' }}
        run: |
          cd csnode
          # how the node ended, if it ends before the head
          # (not "cmd; echo $?": with -e the subshell would end at the failing node)
          ( rc=0; ${{ matrix.node }} --config-file config.ini </dev/null > stdout.log 2>&1 || rc=$?; echo "the node exited with status $rc" > node-exit.txt ) &
          sleep 2
          pid=
          [ "${{ matrix.os }}" = windows ] || pid=$(pgrep -n -f -- '--config-file config.ini' || true)
          echo "NODE_PID=$pid" >> "$GITHUB_ENV"
          cd ..
          # Linux syncs this stretch at 30000+ blocks/min and reaches the head in about 5 minutes: a node
          # that ends, has no API after 4 minutes or moves at less than a tenth of that speed is
          # looked at at once, not after the timeout
          python ci/snapshot/check_node.py wait-head --api 127.0.0.1:9090 --timeout-min "$TIMEOUT_MIN" \
            --exit-file csnode/node-exit.txt --api-grace-min 4 --min-rate 3000 --window-min 2 2>&1 | tee csnode/waithead.txt || {
            echo "---- the end of the node's output"; tail -n 60 csnode/stdout.log
            exit 1
          }

      - name: Stop and collect the digests
        if: always()
        env:
          OS: ${{ matrix.os }}
        run: |
          mkdir -p result
          # a node that never reached the head: where its threads are
          if [ "$OS" = macos ] && [ -n "${NODE_PID:-}" ] && kill -0 "$NODE_PID" 2>/dev/null; then
            sample "$NODE_PID" 5 -file result/sample-macos.txt >/dev/null 2>&1 || true
          fi
          if [ "$OS" = windows ]; then
            taskkill //F //IM node.exe >/dev/null 2>&1 || true
            taskkill //F //IM java.exe >/dev/null 2>&1 || true
          else
            [ -z "${NODE_PID:-}" ] || kill -TERM "$NODE_PID" 2>/dev/null || true
            for _ in $(seq 1 120); do [ -z "${NODE_PID:-}" ] || kill -0 "$NODE_PID" 2>/dev/null || break; sleep 1; done
            pkill -f '[c]ontract-executor[.]jar' || true
          fi
          cat csnode/log/log_*.txt 2>/dev/null | grep -a "STATE DIGEST #" > "result/digests-$OS.txt" || true
          cat csnode/log/log_*.txt 2>/dev/null | grep -aE "counted transactions is different|Couldn't save block|is not on this chain|but its caches already hold block|snapshot.verified|snapshot.mismatch" | head -50 > "result/problems-$OS.txt" || true
          tail -c 2000000 csnode/stdout.log > "result/stdout-$OS.log" 2>/dev/null || true
          cat csnode/node-exit.txt 2>/dev/null | tee result/exit-$OS.txt || true
          cp csnode/waithead.txt "result/waithead-$OS.txt" 2>/dev/null || true
          cp csnode/download.log "result/download-$OS.log" 2>/dev/null || true
          if [ "$OS" = macos ]; then
            sleep 15   # the crash report is written a moment after the process ends
            cp ~/Library/Logs/DiagnosticReports/node*.ips result/ 2>/dev/null || true
            ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | head || true
          fi
          for f in csnode/log/*; do [ -f "$f" ] && tail -c 3000000 "$f" > "result/$OS-$(basename "$f")"; done 2>/dev/null || true
          echo "$(wc -l < "result/digests-$OS.txt") digest lines"; tail -3 "result/digests-$OS.txt"

      - name: Upload the digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.os }}
          path: result/
          retention-days: 30

  compare:
    name: Compare the digests
    needs: sync
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Download the digests
        uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          merge-multiple: true
          path: result

      - name: Compare
        env:
          MIN_COMMON: ${{ inputs.min_common || '5' }}
        run: |
          python3 -I - result "$MIN_COMMON" <<'EOF'
          import os, re, sys
          root, need = sys.argv[1], int(sys.argv[2])
          line = re.compile(r"STATE DIGEST #(\d+) ([0-9A-Fa-f]{64}) wallets (\d+)")
          seen = {}
          for os_name in ("linux", "windows", "macos"):
              d = {}
              path = os.path.join(root, f"digests-{os_name}.txt")
              if os.path.exists(path):
                  for text in open(path, encoding="utf-8", errors="replace"):
                      m = line.search(text)
                      if m:
                          d[int(m.group(1))] = (m.group(2).lower(), int(m.group(3)))   # the last one logged
              seen[os_name] = d
              print(f"{os_name}: {len(d)} blocks with a digest" + (f", {min(d)}..{max(d)}" if d else ""))
          bad = 0
          for seq in sorted(set().union(*seen.values())):
              values = {o: d[seq] for o, d in seen.items() if seq in d}
              if len(set(values.values())) > 1:
                  bad += 1
                  print(f"MISMATCH at block {seq}: {values}")
          common = set.intersection(*(set(d) for d in seen.values()))
          print(f"{len(common)} blocks with a digest from all three systems, {bad} mismatches")
          if bad or len(common) < need:
              sys.exit(1)
          print("the three systems agree")
          # a clean stop: Linux and macOS exit with status 0 (Windows is stopped by taskkill: no status to
          # read), and macOS leaves no crash report (the stop of a macOS node crashed once)
          unclean = []
          for os_name in ("linux", "macos"):
              path = os.path.join(root, f"exit-{os_name}.txt")
              text = open(path, errors="replace").read().strip() if os.path.exists(path) else "no exit status recorded"
              print(f"{os_name}: {text}")
              if not text.endswith("status 0"):
                  unclean.append(f"{os_name}: {text}")
          reports = [f for f in os.listdir(root) if f.endswith(".ips")]
          if reports:
              unclean.append("crash reports: " + ", ".join(reports))
          if unclean:
              print("NOT A CLEAN STOP: " + "; ".join(unclean))
              sys.exit(1)
          print("the nodes stopped cleanly")
          EOF
