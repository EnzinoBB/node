name: Pruned snapshot

# Every 12 hours: start a pruned node from the last published snapshot, bring it to the chain head,
# check it, and publish its state as the new snapshot (release pruned-snapshot). Two formats for one
# release: format 1 (latest.json and the 3 newest archives, for the Docker images of earlier releases)
# and format 2 (snapshot.json, signed, with its files as s<seq>-<name>, the 3 newest sequences; built
# by the node's --export-snapshot from its latest periodic checkpoint, restored by --download-snapshot).
# Nothing is published when a check fails; the previous snapshot stays. See
# docs/specs/2026-10-16-docker-and-pruned-snapshots-design.md.
on:
  schedule:
    - cron: '37 5,17 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'false = build and check both formats without uploading anything (a test run)'
        default: 'true'

# the job that runs the node holds no write token: the node talks to untrusted peers, so a token in
# its environment or in .git/config could be read by a compromised node. Publishing is a separate
# job that never runs the node.
permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      skip: ${{ steps.fetch.outputs.skip }}
      monitor: ${{ steps.monitor.outputs.monitor }}
    env:
      RELEASE: pruned-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # no credentials left for the steps that run the node
      - name: Drop git credentials
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Tools
        run: |
          git submodule update --init -- third-party/lmdb third-party/thrift-interface-definitions
          make -s -C third-party/lmdb/libraries/liblmdb mdb_copy mdb_dump mdb_stat
          sudo apt-get install -y -qq zstd python3-nacl python3-base58
          python3 -m pip install --user --quiet --break-system-packages thriftpy2

      - name: Latest package and snapshot
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no snapshot yet: the first one is published by hand"
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("community-v"))][0]')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-x64.tar.gz' --pattern '*-linux-x64-pruned.tar.gz' --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf "$(ls ./*-linux-x64.tar.gz ./*-linux-x64-pruned.tar.gz 2>/dev/null | head -1)"
          # one package since community.14: the pruned configuration is config.pruned.ini
          [ ! -f csnode/config.pruned.ini ] || cp csnode/config.pruned.ini csnode/config.ini
          echo "${tag#community-v}" > csnode/VERSION
          sed -i 's/^executor_multi_instance=.*/executor_multi_instance=true/' csnode/config.ini
          python3 ci/testnet/gen_keys.py 1 keys >/dev/null
          cp keys/n1/NodePublic.txt keys/n1/NodePrivate.txt csnode/
          packaging/docker/snapshot-restore.sh csnode \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/latest.json"
          echo "package $tag, snapshot block $(python3 -c 'import json; print(json.load(open("csnode/snapshot.json"))["seq"])')"

      - name: Bring the node to the head
        if: env.SKIP != '1'
        run: |
          cd csnode
          ./node --db-path db --config-file config.ini </dev/null > stdout.log 2>&1 &
          echo "NODE_PID=$!" >> "$GITHUB_ENV"
          cd ..
          python3 ci/snapshot/check_node.py wait-head --api 127.0.0.1:9090 --timeout-min 90

      # the monitor is a third party: when it does not answer (exit 3) the snapshot is published
      # without this check, and the release notes say so; a mismatch fails
      - name: Check against the monitor
        id: monitor
        if: env.SKIP != '1'
        run: |
          status=0
          python3 ci/snapshot/check_node.py balances --api 127.0.0.1:9090 --count 50 || status=$?
          if [ "$status" -eq 3 ]; then
            echo "::warning::the monitor cannot be reached: the balances were not compared with it"
            echo "monitor=skipped" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          else
            echo "monitor=checked" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop and check the logs
        if: env.SKIP != '1'
        run: |
          kill -TERM "$NODE_PID"
          for _ in $(seq 1 120); do kill -0 "$NODE_PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$NODE_PID" 2>/dev/null; then kill -KILL "$NODE_PID"; echo "the node did not stop in 120 s"; exit 1; fi
          pkill -f '[c]ontract-executor[.]jar' || true
          bad=$(cat csnode/log/log_*.txt | grep -aE "counted transactions is different|Couldn't save block|is not on this chain|but its caches already hold block" || true)
          [ -z "$bad" ] || { echo "$bad" | head -20; echo "FAIL: the node logged a state problem"; exit 1; }
          echo "head digest: $(ci/snapshot/digest_offline.sh csnode)"

      # format 2: the node packages its latest periodic checkpoint itself; skipped when that checkpoint
      # is the one the run started from (nothing new to publish)
      - name: Package (format 2)
        if: env.SKIP != '1'
        run: |
          published=$(curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/snapshot.json" 2>/dev/null \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["seq"])' 2>/dev/null || echo 0)
          rc=0
          (cd csnode && ./node --db-path db --config-file config.ini --export-snapshot ../out2) > export.log 2>&1 || rc=$?
          cat export.log
          mkdir -p out2
          seq=$(ls out2 | grep -E '^[0-9]+$' | head -1)
          if [ "$rc" != 0 ] || [ -z "$seq" ]; then
            # no periodic checkpoint with a state digest yet: format 1 is still published
            echo "format 2: nothing exported (exit $rc)"; rm -rf out2; mkdir -p out2
          elif [ "$seq" = "$published" ]; then
            echo "format 2: block $seq is already published"; rm -rf out2; mkdir -p out2
          else
            echo "format 2: block $seq (published: $published)"
          fi

      - name: Package
        if: env.SKIP != '1'
        run: |
          packaging/docker/snapshot-make.sh csnode out third-party/lmdb/libraries/liblmdb/mdb_copy \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          size=$(stat -c %s out/credits-pruned-*.tar.zst)
          [ "$size" -lt 2000000000 ] || { echo "FAIL: $size bytes, above the 2 GB asset limit"; exit 1; }
          cat out/latest.json

      - name: Upload snapshot
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: |
            out/
            out2/
          retention-days: 2

  publish:
    needs: snapshot
    if: needs.snapshot.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: pruned-snapshot
      MONITOR: ${{ needs.snapshot.outputs.monitor }}
    steps:
      # into its own folder: the artifact comes from the job that ran the node and is not trusted
      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: artifact

      # the manifest comes from the job that ran the node: check its form and the archive's checksum
      - name: Check
        working-directory: artifact
        run: |
          for e in *; do case "$e" in out|out2) ;; *) echo "FAIL: unexpected $e in the artifact"; exit 1 ;; esac; done
          ls -la out
          python3 -I - <<'PY'
          import json, os, re, hashlib
          m = json.load(open("out/latest.json"))
          assert set(m) == {"seq", "state_digest", "wallets", "checkpoint", "created", "node", "file", "size", "sha256", "run"}, m.keys()
          assert isinstance(m["seq"], int) and m["seq"] > 0
          assert re.fullmatch(r"[0-9A-Fa-f]{64}", m["state_digest"]) and re.fullmatch(r"[0-9a-f]{64}", m["sha256"])
          assert m["file"] == f"credits-pruned-{m['seq']}.tar.zst"
          assert sorted(os.listdir("out")) == sorted(["latest.json", m["file"]]), os.listdir("out")
          path = os.path.join("out", m["file"])
          assert os.path.getsize(path) == m["size"] < 2_000_000_000
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          assert h.hexdigest() == m["sha256"], "checksum"
          print("snapshot", m["file"], "block", m["seq"], "digest", m["state_digest"])
          PY
          # format 2: the manifest's shape, every file's size and SHA-256, names from the fixed table
          python3 -I - <<'PY'
          import json, os, re, hashlib
          seqs = [d for d in os.listdir("out2")] if os.path.isdir("out2") else []
          if not seqs:
              print("format 2: nothing new")
              raise SystemExit(0)
          assert len(seqs) == 1 and seqs[0].isdigit(), seqs
          d = os.path.join("out2", seqs[0])
          m = json.load(open(os.path.join(d, "snapshot.json")))
          assert m["format"] == 2 and m["seq"] == int(seqs[0]), (m["format"], m["seq"])
          assert re.fullmatch(r"[0-9a-f]{64}", m["state_digest"]) and re.fullmatch(r"[0-9a-f]+", m["signature"])
          names = {f["name"] for f in m["files"]}
          assert sorted(os.listdir(d)) == sorted(names | {"snapshot.json"}), os.listdir(d)
          for f in m["files"]:
              assert re.fullmatch(r"(blocks|contracts)\.bin\.lz4|qs-[A-Za-z0-9_.]+\.lz4", f["name"]), f["name"]
              path = os.path.join(d, f["name"])
              assert os.path.getsize(path) == f["size"] < 2_000_000_000, f["name"]
              h = hashlib.sha256()
              with open(path, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              assert h.hexdigest() == f["sha256"], f["name"]
          print("format 2: block", m["seq"], "digest", m["state_digest"], len(m["files"]), "files")
          PY

      - name: Publish
        if: inputs.publish != 'false'
        working-directory: artifact
        run: |
          gh release upload "$RELEASE" out/credits-pruned-*.tar.zst --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE" out/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          # keep the 3 newest archives
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '^credits-pruned-[0-9]+\.tar\.zst$' | sort -t- -k3 -n | head -n -3 \
            | while read -r old; do gh release delete-asset "$RELEASE" "$old" --yes --repo "$GITHUB_REPOSITORY"; done
          echo "published $(ls out/*.tar.zst)"
          # format 2: the files first, then the manifest that names them; the 3 newest sequences kept
          if [ -d out2 ] && [ -n "$(ls out2)" ]; then
            seq=$(ls out2)
            mkdir -p pub2
            for f in out2/"$seq"/*; do
              name=$(basename "$f")
              [ "$name" = snapshot.json ] || cp "$f" "pub2/s$seq-$name"
            done
            gh release upload "$RELEASE" pub2/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release upload "$RELEASE" out2/"$seq"/snapshot.json --clobber --repo "$GITHUB_REPOSITORY"
            gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
              | sed -nE 's/^s([0-9]+)-.*/\1/p' | sort -un | head -n -3 \
              | while read -r old; do
                  gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
                    | grep -E "^s$old-" | while read -r a; do gh release delete-asset "$RELEASE" "$a" --yes --repo "$GITHUB_REPOSITORY"; done
                done
            echo "published format 2: block $seq"
          fi
          if [ "$MONITOR" = skipped ]; then
            # one line per snapshot published without the monitor, the newest first, at most 10
            line="- $(date -u +%F): block ${seq:-$(ls out/*.tar.zst | sed -nE 's/.*-([0-9]+)\.tar\.zst/\1/p')} published without the comparison of balances with the public monitor, which did not answer"
            body=$(gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
            mark='published without the comparison'
            { grep -v "$mark" <<<"$body" | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' || true
              echo; echo "$line"; grep "$mark" <<<"$body" | head -9 || true; } > notes.md
            gh release edit "$RELEASE" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            echo "$line"
          fi
