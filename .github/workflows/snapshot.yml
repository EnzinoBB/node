name: Pruned snapshot

# Every 12 hours: start a pruned node from the last published snapshot, bring it to the chain head,
# check it, and publish its state as the new snapshot (release pruned-snapshot: latest.json and the
# 3 newest archives). A Docker container of a pruned node restores the latest one on its first start.
# Nothing is published when a check fails; the previous snapshot stays. See
# docs/specs/2026-10-16-docker-and-pruned-snapshots-design.md.
on:
  schedule:
    - cron: '37 5,17 * * *'
  workflow_dispatch:

# the job that runs the node holds no write token: the node talks to untrusted peers, so a token in
# its environment or in .git/config could be read by a compromised node. Publishing is a separate
# job that never runs the node.
permissions:
  contents: read

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      skip: ${{ steps.fetch.outputs.skip }}
    env:
      RELEASE: pruned-snapshot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # no credentials left for the steps that run the node
      - name: Drop git credentials
        run: git config --local --unset-all http.https://github.com/.extraheader || true

      - name: Tools
        run: |
          git submodule update --init -- third-party/lmdb third-party/thrift-interface-definitions
          make -s -C third-party/lmdb/libraries/liblmdb mdb_copy mdb_dump mdb_stat
          sudo apt-get install -y -qq zstd python3-nacl python3-base58
          python3 -m pip install --user --quiet --break-system-packages thriftpy2

      - name: Latest package and snapshot
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "no snapshot yet: the first one is published by hand"
            echo "SKIP=1" >> "$GITHUB_ENV"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName,isDraft \
            --jq '[.[] | select(.isDraft | not) | .tagName | select(startswith("community-v"))][0]')
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-linux-x64-pruned.tar.gz' --pattern SHA256SUMS
          sha256sum -c --ignore-missing SHA256SUMS
          tar -xzf *-linux-x64-pruned.tar.gz
          echo "${tag#community-v}" > csnode/VERSION
          sed -i 's/^executor_multi_instance=.*/executor_multi_instance=true/' csnode/config.ini
          python3 ci/testnet/gen_keys.py 1 keys >/dev/null
          cp keys/n1/NodePublic.txt keys/n1/NodePrivate.txt csnode/
          packaging/docker/snapshot-restore.sh csnode \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/latest.json"
          echo "package $tag, snapshot block $(python3 -c 'import json; print(json.load(open("csnode/snapshot.json"))["seq"])')"

      - name: Bring the node to the head
        if: env.SKIP != '1'
        run: |
          cd csnode
          ./node --db-path db --config-file config.ini </dev/null > stdout.log 2>&1 &
          echo "NODE_PID=$!" >> "$GITHUB_ENV"
          cd ..
          python3 ci/snapshot/check_node.py wait-head --api 127.0.0.1:9090 --timeout-min 90

      - name: Check against the monitor
        if: env.SKIP != '1'
        run: python3 ci/snapshot/check_node.py balances --api 127.0.0.1:9090 --count 50

      - name: Stop and check the logs
        if: env.SKIP != '1'
        run: |
          kill -TERM "$NODE_PID"
          for _ in $(seq 1 120); do kill -0 "$NODE_PID" 2>/dev/null || break; sleep 1; done
          if kill -0 "$NODE_PID" 2>/dev/null; then kill -KILL "$NODE_PID"; echo "the node did not stop in 120 s"; exit 1; fi
          pkill -f '[c]ontract-executor[.]jar' || true
          bad=$(cat csnode/log/log_*.txt | grep -aE "counted transactions is different|Couldn't save block|is not on this chain|but its caches already hold block" || true)
          [ -z "$bad" ] || { echo "$bad" | head -20; echo "FAIL: the node logged a state problem"; exit 1; }
          echo "head digest: $(ci/snapshot/digest_offline.sh csnode)"

      - name: Package
        if: env.SKIP != '1'
        run: |
          packaging/docker/snapshot-make.sh csnode out third-party/lmdb/libraries/liblmdb/mdb_copy \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          size=$(stat -c %s out/credits-pruned-*.tar.zst)
          [ "$size" -lt 2000000000 ] || { echo "FAIL: $size bytes, above the 2 GB asset limit"; exit 1; }
          cat out/latest.json

      - name: Upload snapshot
        if: env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: snapshot
          path: out/
          retention-days: 2

  publish:
    needs: snapshot
    if: needs.snapshot.outputs.skip != '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE: pruned-snapshot
    steps:
      - name: Download snapshot
        uses: actions/download-artifact@v4
        with:
          name: snapshot
          path: out

      # the manifest comes from the job that ran the node: check its form and the archive's checksum
      - name: Check
        run: |
          ls -la out
          python3 - <<'PY'
          import json, os, re, hashlib
          m = json.load(open("out/latest.json"))
          assert set(m) == {"seq", "state_digest", "wallets", "checkpoint", "created", "node", "file", "size", "sha256", "run"}, m.keys()
          assert isinstance(m["seq"], int) and m["seq"] > 0
          assert re.fullmatch(r"[0-9A-Fa-f]{64}", m["state_digest"]) and re.fullmatch(r"[0-9a-f]{64}", m["sha256"])
          assert m["file"] == f"credits-pruned-{m['seq']}.tar.zst"
          assert sorted(os.listdir("out")) == sorted(["latest.json", m["file"]]), os.listdir("out")
          path = os.path.join("out", m["file"])
          assert os.path.getsize(path) == m["size"] < 2_000_000_000
          h = hashlib.sha256()
          with open(path, "rb") as f:
              for chunk in iter(lambda: f.read(1 << 20), b""):
                  h.update(chunk)
          assert h.hexdigest() == m["sha256"], "checksum"
          print("snapshot", m["file"], "block", m["seq"], "digest", m["state_digest"])
          PY

      - name: Publish
        run: |
          gh release upload "$RELEASE" out/credits-pruned-*.tar.zst --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE" out/latest.json --clobber --repo "$GITHUB_REPOSITORY"
          # keep the 3 newest archives
          gh release view "$RELEASE" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | grep -E '^credits-pruned-[0-9]+\.tar\.zst$' | sort -t- -k3 -n | head -n -3 \
            | while read -r old; do gh release delete-asset "$RELEASE" "$old" --yes --repo "$GITHUB_REPOSITORY"; done
          echo "published $(ls out/*.tar.zst)"
