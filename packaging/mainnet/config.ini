[params]
hosts_filename=known_hosts.txt
init_trusted_filename=default_confidants.txt
ipv6=false
min_compatible_version=503
; true (the default of the node binary): a synced block that fails this node's own transaction
; check is logged ("skip block validation") and stored. With false the node stops at it for good:
; replaying some contracts (games that read their own balance) is not reproducible, so a syncing
; node can disagree with the network on a few balances by a fee and would then reject valid blocks
compatible_version=true
; true: contract calls are re-executed while syncing to get their states provisionally; the
; states that do not match the chain are fetched from the confidants once the node is live.
; false: no re-execution while syncing, every state is fetched (no executor needed to sync)
sync_contract_execution=true

[host_input]
port=9510

[api]
port=9090
diag_port=9088
executor_port=9080
apiexec_port=9070
executor_command=./ojdkbuild/java-11-openjdk-11.0.4/bin/java -Xmx768m -XX:MaxMetaspaceSize=256m -jar contract-executor.jar
executor_commit_min=1518
executor_commit_max=1518
executor_check_version_delay=7000
executor_multi_instance=false

[pool_sync]
one_reply_block=false
block_pools_count=150

[Core]
Filter="%Severity% >= info"

[Sinks.Console]
Destination=Console
Filter="%Severity% >= info"
AutoFlush=true

[Sinks.File]
Destination=TextFile
FileName="log/log_%N.txt"
Format="[%TimeStamp%] [%Severity%] %Message%"
AutoFlush=true
Filter="%Severity% >= debug"
Target="log"
MaxFiles=10
RotationSize=52428800

[event_report]
;do7
ip=165.22.212.106
port=9500
consensus_liar=true
consensus_silent=true
consensus_failed=true
contracts_liar=true
contracts_silent=true
contracts_failed=true
add_gray_list=true
erase_gray_list=true
reject_transaction=true
reject_contract_execution=true
reject_contract_consensus=true
alarm_invalid_block=true
big_bang=true

